[project]
name = "transiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adore_blvnk", email = "83258252+adoreblvnk@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "streamlit>=1.66.0",
    "streamlit-folium>=0.27.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
transiq = "transiq:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
