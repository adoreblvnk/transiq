services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: transiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transiq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-transiq_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transiq} -d ${POSTGRES_DB:-transiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: transiq_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-transiq_secret}
      NEO4J_server_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: transiq_api
    restart: unless-stopped
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-transiq}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-transiq_secret}
      - POSTGRES_DB=${POSTGRES_DB:-transiq_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-transiq_secret}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # ui service will be replaced by the new frontend service once initialized
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
